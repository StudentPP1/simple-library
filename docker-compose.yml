services:
  db:
    image: postgres:16-alpine
    container_name: simple-library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/SimpleLibrary
    container_name: simple-library-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      Swagger__Enabled: ${SWAGGER_ENABLED}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      SecuritySettings__LibrarianInviteCode: ${LIBRARIAN_INVITE_CODE}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: simple-library-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:3000"

  tests:
    build:
      context: ./backend/SimpleLibrary
      target: test
    container_name: simple-library-tests
    profiles: ["test"]

volumes:
  postgres_data:
