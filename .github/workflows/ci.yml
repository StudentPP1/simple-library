name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/SimpleLibrary
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
      
    - name: Test
      run: dotnet test --no-build --verbosity normal

  api-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Create .env for CI
      run: |
        cp .env.example .env
        sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 12)|" .env
        sed -i "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=$(openssl rand -hex 32)|" .env
        echo "LIBRARIAN_CODE=$(openssl rand -hex 8)" >> "$GITHUB_ENV"

    - name: Start database and backend
      run: |
        sed -i "s|^LIBRARIAN_INVITE_CODE=.*|LIBRARIAN_INVITE_CODE=${LIBRARIAN_CODE}|" .env
        docker compose up -d --build --wait db backend

    - name: Run Postman collection
      run: |
        npx --yes newman@6 run tests/api/SimpleLibrary.postman_collection.json \
          -e tests/api/local.postman_environment.json \
          --env-var librarianCode=${LIBRARIAN_CODE} \
          --reporters cli,junit --reporter-junit-export newman-report.xml

    - name: Upload Newman report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newman-report
        path: newman-report.xml

    - name: Backend logs on failure
      if: failure()
      run: docker compose logs backend

  build-and-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build
      run: npm run build
      
    - name: Lint
      run: npm run lint
